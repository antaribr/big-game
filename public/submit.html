<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Team Hub — Event Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --text-dim: #475569;
    --text-muted: #94a3b8;
    --border: #e2e8f0;
    --orange: #f97316;
    --orange-light: #ffedd5;
    --orange-dark: #ea580c;
    --green: #10b981;
    --green-light: #ecfdf5;
    --red: #f43f5e;
    --red-light: #fff1f2;
    --blue: #3b82f6;
    --blue-light: #eff6ff;
    --purple: #6366f1;
    --purple-light: #e0e7ff;
    --radius-sm: 0.5rem;
    --radius-md: 0.85rem;
    --radius-lg: 1.25rem;
    --font: 'Plus Jakarta Sans', system-ui, sans-serif;
    --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.1), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 40px;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Header Styles */
  .header-panel {
    padding: 32px 0 20px;
    text-align: center;
  }
  .header-panel h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
  }

  /* Pro Team Banner */
  .team-banner {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow-sm);
  }
  .team-banner .tb-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 4px var(--bg);
  }
  .team-banner .tb-info { flex: 1; }
  .team-banner .tb-name { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; }
  .team-banner .tb-sub { font-size: 0.8rem; color: var(--text-dim); margin-top: 1px; }
  .team-banner .tb-badge {
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 0.75rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Dashboard Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 8px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s;
  }
  .stat .s-num { font-size: 1.6rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
  .stat .s-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-top: 2px; }

  /* Premium Tab Navigation */
  .nav-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    padding: 6px;
    background: #e2e8f0;
    border-radius: var(--radius-md);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
  }
  .nav-bar button {
    flex: 1;
    border: none;
    padding: 12px 10px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .nav-bar button:hover { color: var(--text); }
  .nav-bar button.active {
    background: var(--card);
    color: var(--text);
    box-shadow: var(--shadow-md);
  }
  
  .btn-badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
  }
  .btn-badge.badge-approved { background: var(--green-light); color: var(--green); }
  .btn-badge.badge-rejected { background: var(--red-light); color: var(--red); }

  /* Section Systems */
  .sec { display: none; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .sec.active { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  
  .sec-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.02em; }
  .sec-title .st-back {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
  }
  .sec-title .st-back:hover { background: var(--bg); transform: scale(1.05); }

  /* Category List Home View */
  .cat-progress-list { display: flex; flex-direction: column; gap: 12px; }
  .cp-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-sm); }
  .cp-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cp-name { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
  .cp-pts { font-weight: 700; font-size: 0.9rem; color: var(--text); }
  .cp-bar { height: 6px; background: #f1f5f9; border-radius: 100px; overflow: hidden; }
  .cp-fill { height: 100%; border-radius: 100px; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

  /* Step 1 Category Matrix Grid */
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .cat-btn { padding: 20px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); cursor: pointer; text-align: left; transition: all 0.2s; font-family: inherit; box-shadow: var(--shadow-sm); }
  .cat-btn:hover { border-color: var(--orange); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .cat-btn .cb-icon { font-size: 1.8rem; margin-bottom: 12px; }
  .cat-btn .cb-name { font-weight: 700; font-size: 0.95rem; line-height: 1.2; color: var(--text); }
  .cat-btn .cb-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; font-weight: 500; }

  /* Step 2 Task Cards */
  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task-btn { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); cursor: pointer; text-align: left; transition: all 0.2s; display: flex; align-items: center; gap: 14px; font-family: inherit; box-shadow: var(--shadow-sm); }
  .task-btn:hover { border-color: var(--orange); box-shadow: var(--shadow-md); }
  .task-btn.done { opacity: 0.65; background: #fafafa; border-color: var(--border); }
  .task-btn.pending { border-color: #fde047; background: #fefce8; }
  .task-btn.rejected { border-color: var(--red); background: var(--red-light); }
  
  .task-btn .tk-num { width: 32px; height: 32px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: var(--text-dim); flex-shrink: 0; border: 1px solid var(--border); }
  .task-btn.done .tk-num { background: var(--green); color: #fff; border-color: var(--green); }
  .task-btn.pending .tk-num { background: #eab308; color: #fff; border-color: #eab308; }
  .task-btn.rejected .tk-num { background: var(--red); color: #fff; border-color: var(--red); }
  
  .task-btn .tk-info { flex: 1; min-width: 0; }
  .task-btn .tk-name { font-weight: 600; font-size: 0.9rem; color: var(--text); letter-spacing: -0.01em; }
  .task-btn .tk-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .task-btn .tk-pts { font-weight: 700; color: var(--text); font-size: 0.9rem; flex-shrink: 0; }
  .task-btn.done .tk-pts { color: var(--green); }
  .task-btn.pending .tk-pts { color: #a16207; }
  .task-btn.rejected .tk-pts { color: var(--red); }

  .lvl { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  .lvl-easy { background: var(--green-light); color: var(--green); }
  .lvl-medium { background: var(--blue-light); color: var(--blue); }
  .lvl-hard { background: var(--orange-light); color: var(--orange-dark); }
  .lvl-rare { background: var(--purple-light); color: var(--purple); }

  /* Step 3 Professional Upload Engine Dropzone */
  .upload-area { border: 2px dashed #cbd5e1; border-radius: var(--radius-md); padding: 36px 20px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--card); position: relative; box-shadow: var(--shadow-sm); }
  .upload-area:hover { border-color: var(--orange); background: var(--orange-light); }
  .upload-area.has-file { border-color: var(--green); background: var(--card); border-style: solid; }
  .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 10; }
  .upload-area .up-icon { font-size: 2.2rem; margin-bottom: 8px; transition: transform 0.2s; }
  .upload-area:hover .up-icon { transform: scale(1.1); }
  .upload-area .up-text { font-size: 0.9rem; color: var(--text-dim); font-weight: 500; }
  .upload-area .up-text strong { color: var(--orange); font-weight: 600; }
  .upload-area .up-file { font-size: 0.85rem; color: var(--green); font-weight: 700; margin-top: 8px; background: var(--green-light); display: inline-block; padding: 4px 12px; border-radius: 30px; border: 1px solid #bbf7d0; }
  .upload-preview { max-width: 100%; max-height: 140px; margin: 12px auto 0; border-radius: var(--radius-sm); display: none; box-shadow: var(--shadow-md); object-fit: contain; }

  textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; font-family: inherit; background: var(--card); color: var(--text); outline: none; resize: vertical; min-height: 80px; margin-top: 14px; box-shadow: var(--shadow-sm); transition: border-color 0.2s; }
  textarea:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }

  .submit-btn { width: 100%; padding: 16px; border: none; border-radius: var(--radius-md); background: var(--orange); color: #fff; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 16px; font-family: inherit; transition: all 0.2s; box-shadow: var(--shadow-md); }
  .submit-btn:hover { background: var(--orange-dark); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .msg { padding: 14px 16px; border-radius: var(--radius-md); margin-top: 14px; font-size: 0.88rem; font-weight: 600; display: none; box-shadow: var(--shadow-sm); }
  .msg.ok { display: block; background: var(--green-light); color: #065f46; border: 1px solid #a7f3d0; }
  .msg.err { display: block; background: var(--red-light); color: #9f1239; border: 1px solid #fecdd3; }

  /* History Cards */
  .sub-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
  .sub-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .sub-icon { font-size: 1.1rem; flex-shrink: 0; }
  .sub-task { font-weight: 700; font-size: 0.95rem; flex: 1; color: var(--text); }
  .sub-badge { padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.03em; }
  .sub-pending { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
  .sub-approved { background: var(--green-light); color: #059669; border: 1px solid #a7f3d0; }
  .sub-rejected { background: var(--red-light); color: #e11d48; border: 1px solid #fecdd3; }
  .sub-detail { font-size: 0.8rem; color: var(--text-dim); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .sub-pts { font-weight: 700; color: var(--orange); }
  .sub-timestamps { font-size: 0.75rem; color: var(--text-muted); width: 100%; margin-top: 10px; display: flex; flex-direction: column; gap: 4px; border-top: 1px dashed var(--border); padding-top: 10px; }

  /* Standings Panel */
  .mini-lb { display: flex; flex-direction: column; gap: 8px; }
  .mlb-entry { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; display: flex; align-items: center; gap: 14px; font-size: 0.9rem; box-shadow: var(--shadow-sm); transition: transform 0.2s; }
  .mlb-entry.me { border-color: var(--orange); background: var(--orange-light); }
  .mlb-rank { width: 32px; height: 32px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; border: 1px solid var(--border); color: var(--text-dim); }
  .mlb-rank.r1 { background: #fef3c7; color: #b45309; border-color: #fcd34d; }
  .mlb-rank.r2 { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
  .mlb-rank.r3 { background: #ffedd5; color: #c2410c; border-color: #fed7aa; }
  .mlb-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
  .mlb-name { flex: 1; font-weight: 600; color: var(--text); }
  .mlb-entry.me .mlb-name { font-weight: 700; }
  .mlb-pts { font-weight: 700; color: var(--text); }

  /* Global Overlay System */
  .pin-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.3); z-index: 200; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
  .pin-overlay.show { display: flex; }
  .pin-box { background: var(--card); border-radius: var(--radius-lg); padding: 32px 24px; width: 90%; max-width: 360px; text-align: center; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
  .pin-box h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.02em; }
  .pin-box .pb-sub { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px; }
  .pin-box .pb-team { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 20px; font-weight: 700; font-size: 1rem; }
  .pin-input { width: 100%; padding: 14px; text-align: center; font-size: 1.6rem; font-weight: 700; letter-spacing: 0.3em; border: 2px solid var(--border); border-radius: var(--radius-md); background: var(--bg); color: var(--text); outline: none; font-family: inherit; transition: border-color 0.2s; }
  .pin-input:focus { border-color: var(--orange); }
  .pin-input.error { border-color: var(--red); animation: shake 0.3s ease; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .pin-err { color: var(--red); font-size: 0.8rem; margin-top: 8px; font-weight: 600; display: none; }
  .pin-btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-md); background: var(--orange); color: #fff; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 16px; font-family: inherit; box-shadow: var(--shadow-md); }
  .pin-btn:hover { background: var(--orange-dark); }
  .pin-cancel { background: none; border: none; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; margin-top: 12px; font-family: inherit; font-weight: 500; }
  .pin-cancel:hover { color: var(--text-dim); }

  .toast-container { position: fixed; top: 16px; right: 16px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 18px; font-size: 0.85rem; font-weight: 600; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; max-width: 320px; animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="container">
  <div class="header-panel"><h1>🏆 Team Hub</h1></div>

  <!-- Locked Tracking Metrics Modules -->
  <div id="teamBanner" style="display:none"></div>
  <div class="stats-grid" id="myStats" style="display:none"></div>

  <!-- Tab Controller Shell Layout Component -->
  <div class="nav-bar" id="mainNav" style="display:none">
    <button class="active" onclick="showSec('home',this)">🏠 Progress</button>
    <button onclick="showSec('submit',this)">📝 Submit</button>
    <button id="historyTabBtn" onclick="showSec('history',this)">
      📋 My Tasks
      <span id="badgeApproved" class="btn-badge badge-approved" style="display:none">0</span>
      <span id="badgeRejected" class="btn-badge badge-rejected" style="display:none">0</span>
    </button>
    <button onclick="showSec('leaderboard',this)">🏅 Standings</button>
    <button onclick="manualRefresh()" style="flex:0;min-width:auto;padding:12px; background: transparent; box-shadow: none;" title="Refresh now">🔄</button>
  </div>

  <!-- HOME VIEW -->
  <div class="sec active" id="sec-home">
    <div class="sec-title">📊 Category Progress</div>
    <div class="cat-progress-list" id="catProgressList"></div>
  </div>

  <!-- SUBMIT VIEW FRAMEWORK -->
  <div class="sec" id="sec-submit">
    <div id="submitStep1">
      <div class="sec-title">📂 Select Challenge Category</div>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div id="submitStep2" style="display:none">
      <div class="sec-title"><div class="st-back" onclick="backToCats()">←</div> <span id="catTitle">Tasks</span></div>
      <div class="task-list" id="taskList"></div>
    </div>
    <div id="submitStep3" style="display:none">
      <div class="sec-title"><div class="st-back" onclick="backToTasks()">←</div> Evidence Delivery</div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-sm)">
        <div style="font-weight:700;font-size:1rem;color:var(--text)" id="selTaskName"></div>
        <div style="font-size:0.8rem;color:var(--text-dim);margin-top:4px" id="selTaskMeta"></div>
      </div>
      <div class="upload-area" id="uploadArea">
        <input type="file" id="evidenceFile" accept="image/*,video/*" multiple onchange="onFileChange()">
        <div class="up-icon">📸</div>
        <div class="up-text"><strong>Tap to attach files</strong> (Up to 5 images or videos)</div>
        <div class="up-file" id="fileName" style="display:none"></div>
        <img class="upload-preview" id="filePreview">
      </div>
      <textarea id="note" placeholder="Write any notes or details here (optional)..."></textarea>
      <button class="submit-btn" id="submitBtn" onclick="submitTask()" disabled>Submit Task for Verification</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <!-- HISTORY MODULE PANEL -->
  <div class="sec" id="sec-history">
    <div class="sec-title">📋 My Activity Log</div>
    <div id="historyList"></div>
  </div>

  <!-- STANDINGS OVERVIEW FRAME -->
  <div class="sec" id="sec-leaderboard">
    <div class="sec-title">🏅 Event Standings</div>
    <div class="mini-lb" id="miniLB"></div>
  </div>

  <!-- Initial Launcher Screen Layer -->
  <div id="teamSelectScreen" style="display:none">
    <div class="sec-title" style="margin-bottom:16px;justify-content:center">👋 Select your team identity</div>
    <div class="team-grid" id="teamGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px"></div>
  </div>
</div>

<!-- Verification Security Box -->
<div class="pin-overlay" id="pinOverlay">
  <div class="pin-box">
    <h3>🔐 Security Verification</h3>
    <div class="pb-sub">Enter your team unlock code PIN</div>
    <div class="pb-team"><span id="pinTeamDot" style="width:12px;height:12px;border-radius:50%;display:inline-block"></span><span id="pinTeamName"></span></div>
    <input type="tel" class="pin-input" id="pinInput" maxlength="6" placeholder="••••" inputmode="numeric" autocomplete="off">
    <div class="pin-err" id="pinErr">❌ Invalid Code Verification</div>
    <button class="pin-btn" id="pinBtn" onclick="verifyPin()">Verify & Unlock</button>
    <button class="pin-cancel" onclick="closePin()">Cancel</button>
  </div>
</div>

<script>
let CATEGORIES = [];
let teams=[], myTeamId=null, myCatId=null, myTaskNum=null, doneMap={}, pendingMap={}, allSubs=[];
let activeSection = 'home';

async function loadCategoriesFromDB() {
  try {
    const res = await fetch('/api/tasks');
    const tasks = await res.json();
    if (tasks.length === 0) return;

    const catMap = {};
    tasks.forEach(t => {
      if (!catMap[t.category_id]) {
        catMap[t.category_id] = {
          id: t.category_id,
          name: t.category_name,
          icon: t.category_icon || '📋',
          tasks: []
        };
      }
      catMap[t.category_id].tasks.push({
        num: t.task_num,
        name: t.task_name,
        evidence: t.evidence || '',
        level: t.level || 'Easy',
        pts: t.points || 20,
        comment: t.comment || ''
      });
    });
    Object.values(catMap).forEach(cat => cat.tasks.sort((a, b) => a.num - b.num));
    CATEGORIES = Object.values(catMap);
  } catch (e) {
    console.error('Failed to parse remote event tasks matrix map:', e);
  }
}

async function api(m,p,b){const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);return(await fetch('/api'+p,o)).json();}
function toast(icon,msg){const c=document.getElementById('toastContainer'),t=document.createElement('div');t.className='toast';t.innerHTML='<span style="font-size:1rem">'+icon+'</span> '+msg;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},3000);}

function showSec(id,btn){
  activeSection = id;
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  document.querySelectorAll('.nav-bar button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  
  if (id === 'history') {
    clearUnreadCounters();
  }
}

async function init(){
  await loadCategoriesFromDB();
  const data=await api('GET','/state');
  teams=data.teams||[];
  const lockedId=localStorage.getItem(LOCK_KEY);
  if(lockedId){
    const team=teams.find(t=>t.id===parseInt(lockedId));
    if(team){lockTeam(team.id);return;}
    else localStorage.removeItem(LOCK_KEY);
  }
  showTeamSelect();
}

function showTeamSelect(){
  document.getElementById('teamSelectScreen').style.display='block';
  document.getElementById('mainNav').style.display='none';
  document.getElementById('myStats').style.display='none';
  document.getElementById('teamBanner').style.display='none';
  document.getElementById('teamGrid').innerHTML=teams.map(t=>
    '<div style="padding:20px 16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);cursor:pointer;text-align:center;box-shadow:var(--shadow-sm);" onclick="pickTeam('+t.id+')">'+
    '<div style="width:14px;height:14px;border-radius:50%;background:'+t.color+';margin:0 auto 10px;box-shadow:0 0 0 4px var(--bg)"></div>'+
    '<div style="font-weight:700;font-size:0.95rem;color:var(--text)">'+t.name+'</div>'+
    '<div style="font-size:.78rem;color:var(--text-dim);margin-top:2px">'+t.members.length+' members</div></div>'
  ).join('');
}

let pendingTeamId=null;
function pickTeam(id){
  pendingTeamId=id;const team=teams.find(t=>t.id===id);
  document.getElementById('pinTeamDot').style.background=team.color;
  document.getElementById('pinTeamName').textContent=team.name;
  document.getElementById('pinInput').value='';document.getElementById('pinErr').style.display='none';
  document.getElementById('pinInput').classList.remove('error');
  document.getElementById('pinOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('pinInput').focus(),100);
}
function closePin(){document.getElementById('pinOverlay').classList.remove('show');pendingTeamId=null;}
async function verifyPin(){
  const pin=document.getElementById('pinInput').value.trim();if(!pin)return;
  const btn=document.getElementById('pinBtn');btn.disabled=true;btn.textContent='Verifying...';
  try{
    const res=await api('POST','/verify-pin',{teamId:pendingTeamId,pin});
    if(res.valid){document.getElementById('pinOverlay').classList.remove('show');localStorage.setItem(LOCK_KEY,pendingTeamId);lockTeam(pendingTeamId);}
    else{document.getElementById('pinInput').classList.add('error');document.getElementById('pinErr').style.display='block';document.getElementById('pinInput').value='';document.getElementById('pinInput').focus();}
  }catch(e){document.getElementById('pinErr').textContent='❌ Infrastructure Error';document.getElementById('pinErr').style.display='block';}
  btn.disabled=false;btn.textContent='Verify & Unlock';
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('pinOverlay').classList.contains('show'))verifyPin();});

async function lockTeam(id){
  myTeamId=id;const team=teams.find(t=>t.id===id);
  doneMap={};pendingMap={};
  if(team.completions)team.completions.forEach(c=>{doneMap[c.categoryId+'-'+c.taskNum]=true;});
  document.getElementById('teamSelectScreen').style.display='none';
  document.getElementById('teamBanner').style.display='flex';
  document.getElementById('myStats').style.display='grid';
  document.getElementById('mainNav').style.display='flex';
  document.getElementById('teamBanner').innerHTML=
    '<div class="tb-dot" style="background:'+team.color+'"></div>'+
    '<div class="tb-info"><div class="tb-name">'+team.name+'</div>'+
    '<div class="tb-sub">'+team.members.length+' participants</div></div>'+
    '<span class="tb-badge">🔒 Synchronized</span>'+
    '<button style="background:none;border:1px solid var(--border);border-radius:.4rem;padding:4px 10px;font-size:.72rem;color:var(--text-dim);cursor:pointer;font-family:inherit;font-weight:500;" onclick="if(confirm(\'De-synchronize identity layout profile? Requires valid target verification pin.\')){localStorage.removeItem(\'event_team_lock\');localStorage.removeItem(SEEN_SUBS_KEY);location.reload();}">Disconnect</button>';
  await loadSubs();renderAll();
}

async function loadSubs(){
  const data=await api('GET','/state');teams=data.teams||[];
  const subData=await fetch('/api/submissions?status=pending').then(r=>r.json());
  const appr=await fetch('/api/submissions?status=approved').then(r=>r.json());
  const rej=await fetch('/api/submissions?status=rejected').then(r=>r.json());
  
  const fetchedSubs=[...subData.filter(s=>s.team_id===myTeamId),...appr.filter(s=>s.team_id===myTeamId),...rej.filter(s=>s.team_id===myTeamId)];
  fetchedSubs.sort((a,b)=>b.id-a.id);
  
  calculateUnreadBadges(fetchedSubs);
  
  allSubs = fetchedSubs;
  pendingMap = {};
  allSubs.forEach(s=>{
    if(s.status==='pending')pendingMap[s.category_id+'-'+s.task_num]='pending';
    if(s.status==='rejected')pendingMap[s.category_id+'-'+s.task_num]='rejected';
  });
}

function calculateUnreadBadges(newSubs) {
  let historicalMap = {};
  try { historicalMap = JSON.parse(localStorage.getItem(SEEN_SUBS_KEY) || '{}'); } catch(e) {}
  
  let unreadApproved = 0, unreadRejected = 0;
  newSubs.forEach(s => {
    const key = s.id; const oldStatus = historicalMap[key];
    if (oldStatus === 'pending' || !oldStatus) {
      if (s.status === 'approved' && oldStatus === 'pending') unreadApproved++;
      if (s.status === 'rejected' && oldStatus === 'pending') unreadRejected++;
    }
    if (!historicalMap[key]) historicalMap[key] = s.status;
  });
  
  localStorage.setItem(SEEN_SUBS_KEY, JSON.stringify(historicalMap));
  const badgeApp = document.getElementById('badgeApproved'), badgeRej = document.getElementById('badgeRejected');

  if (unreadApproved > 0 && activeSection !== 'history') {
    badgeApp.textContent = unreadApproved; badgeApp.style.display = 'inline-block';
  } else badgeApp.style.display = 'none';

  if (unreadRejected > 0 && activeSection !== 'history') {
    badgeRej.textContent = unreadRejected; badgeRej.style.display = 'inline-block';
  } else badgeRej.style.display = 'none';
}

function clearUnreadCounters() {
  let historicalMap = {};
  try { historicalMap = JSON.parse(localStorage.getItem(SEEN_SUBS_KEY) || '{}'); } catch(e) {}
  allSubs.forEach(s => { historicalMap[s.id] = s.status; });
  localStorage.setItem(SEEN_SUBS_KEY, JSON.stringify(historicalMap));
  document.getElementById('badgeApproved').style.display = 'none';
  document.getElementById('badgeRejected').style.display = 'none';
}

function myTeam(){return teams.find(t=>t.id===myTeamId);}
function myPoints(){
  const team=myTeam();if(!team)return 0;let pts=0;
  const done=getDoneMap(team);
  CATEGORIES.forEach(cat=>cat.tasks.forEach(t=>{if(done[cat.id+'-'+t.num])pts+=t.pts;}));
  return pts;
}
function getDoneMap(team){const m={};if(team.completions)team.completions.forEach(c=>{m[c.categoryId+'-'+c.taskNum]=true;});return m;}

function renderAll(){
  const team=myTeam();if(!team)return;
  const done=getDoneMap(team);const doneCount=Object.keys(done).length;
  const pts=myPoints();
  const sorted=[...teams].sort((a,b)=>{const pa=getDoneMap(a);const pb=getDoneMap(b);let sa=0,sb=0;CATEGORIES.forEach(c=>c.tasks.forEach(t=>{if(pa[c.id+'-'+t.num])sa+=t.pts;if(pb[c.id+'-'+t.num])sb+=t.pts;}));return sb-sa;});
  const rank=sorted.findIndex(t=>t.id===myTeamId)+1;
  const pendingCount=allSubs.filter(s=>s.status==='pending').length;

  document.getElementById('myStats').innerHTML=
    '<div class="stat"><div class="s-num" style="color:var(--text)">'+pts+'</div><div class="s-label">Score</div></div>'+
    '<div class="stat"><div class="s-num" style="color:var(--green)">'+doneCount+'</div><div class="s-label">Passed</div></div>'+
    '<div class="stat"><div class="s-num" style="color:var(--blue)">'+pendingCount+'</div><div class="s-label">Queue</div></div>'+
    '<div class="stat"><div class="s-num" style="color:var(--purple)">#'+rank+'</div><div class="s-label">Rank</div></div>';

  renderCatProgress();renderCats();renderHistory();renderLB();
}

function renderCatProgress(){
  const done=getDoneMap(myTeam());
  document.getElementById('catProgressList').innerHTML=CATEGORIES.map(cat=>{
    const catDone=cat.tasks.filter(t=>done[cat.id+'-'+t.num]).length;
    const catMax=cat.tasks.reduce((s,t)=>s+t.pts,0);
    const catEarned=cat.tasks.reduce((s,t)=>s+(done[cat.id+'-'+t.num]?t.pts:0),0);
    const pct=Math.round((catDone/cat.tasks.length)*100);
    return '<div class="cp-card"><div class="cp-top"><div class="cp-name">'+cat.icon+' '+cat.name+'</div><div class="cp-pts">'+catEarned+'/'+catMax+'</div></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-dim);margin-bottom:6px"><span>'+catDone+'/'+cat.tasks.length+' completed</span><span>'+pct+'%</span></div>'+
      '<div class="cp-bar"><div class="cp-fill" style="width:'+pct+'%;background:'+myTeam().color+'"></div></div></div>';
  }).join('');
}

function renderCats(){
  const done=getDoneMap(myTeam());
  document.getElementById('catGrid').innerHTML=CATEGORIES.map(c=>{
    const total=c.tasks.length;const dn=c.tasks.filter(t=>done[c.id+'-'+t.num]).length;
    return '<div class="cat-btn" onclick="pickCat(\''+c.id+'\')"><div class="cb-icon">'+c.icon+'</div><div class="cb-name">'+c.name+'</div><div class="cb-meta">'+dn+'/'+total+' parsed</div></div>';
  }).join('');
}
function pickCat(id){
  myCatId=id;const cat=CATEGORIES.find(c=>c.id===id);
  document.getElementById('catTitle').textContent=cat.icon+' '+cat.name;
  renderTasks();document.getElementById('submitStep1').style.display='none';document.getElementById('submitStep2').style.display='block';
}
function backToCats(){document.getElementById('submitStep1').style.display='block';document.getElementById('submitStep2').style.display='none';document.getElementById('submitStep3').style.display='none';}

function renderTasks(){
  const cat=CATEGORIES.find(c=>c.id===myCatId);const done=getDoneMap(myTeam());
  document.getElementById('taskList').innerHTML=cat.tasks.map(t=>{
    const key=myCatId+'-'+t.num;const isDone=done[key];const subStatus=pendingMap[key];
    const isPending=subStatus==='pending';const isRejected=subStatus==='rejected';
    let cls='',status='',clickable=true;
    if(isDone){cls='done';status='✅ Approved';clickable=false;}
    else if(isPending){cls='pending';status='⏳ Waiting';clickable=false;}
    else if(isRejected){cls='rejected';status='❌ Retry Flag';clickable=true;}
    else{status='+'+t.pts+' pts';}
    const onclick=clickable?' onclick="pickTask('+t.num+')"':'';
    return '<div class="task-btn '+cls+'"'+onclick+'><div class="tk-num">'+t.num+'</div>'+
      '<div class="tk-info"><div class="tk-name">'+t.name+'</div><div class="tk-meta"><span class="lvl lvl-'+t.level.toLowerCase()+'">'+t.level+'</span> '+t.evidence+'</div></div>'+
      '<div class="tk-pts">'+status+'</div></div>';
  }).join('');
}
function pickTask(num){
  myTaskNum=num;const cat=CATEGORIES.find(c=>c.id===myCatId);const task=cat.tasks.find(t=>t.num===num);
  document.getElementById('selTaskName').textContent=task.name;
  document.getElementById('selTaskMeta').innerHTML='<span class="lvl lvl-'+task.level.toLowerCase()+'">'+task.level+'</span> • '+task.pts+' pts • Required: '+task.evidence;
  document.getElementById('evidenceFile').value='';document.getElementById('fileName').style.display='none';
  document.getElementById('filePreview').style.display='none';document.getElementById('uploadArea').classList.remove('has-file');
  document.getElementById('note').value='';document.getElementById('msg').style.display='none';document.getElementById('submitBtn').disabled=true;
  document.getElementById('submitStep2').style.display='none';document.getElementById('submitStep3').style.display='block';
}
function backToTasks(){document.getElementById('submitStep2').style.display='block';document.getElementById('submitStep3').style.display='none';}

function onFileChange(){
  const files=document.getElementById('evidenceFile').files;
  if(!files.length)return;
  
  if (files.length > 5) {
    alert("You can upload a maximum of 5 evidence files.");
    document.getElementById('evidenceFile').value = '';
    document.getElementById('uploadArea').classList.remove('has-file');
    document.getElementById('fileName').style.display = 'none';
    document.getElementById('filePreview').style.display = 'none';
    document.getElementById('submitBtn').disabled = true;
    return;
  }
  
  document.getElementById('uploadArea').classList.add('has-file');
  const fn = document.getElementById('fileName');
  fn.textContent = '📎 '+files.length+' evidence asset'+(files.length>1?'s':'')+' attached';
  fn.style.display = 'inline-block';
  document.getElementById('submitBtn').disabled = false;
  const p=document.getElementById('filePreview');
  const f=files[0];
  if(f.type.startsWith('image/')){const r=new FileReader();r.onload=e=>{p.src=e.target.result;p.style.display='block'};r.readAsDataURL(f);}
  else p.style.display='none';
}

async function submitTask(){
  const btn=document.getElementById('submitBtn'),msg=document.getElementById('msg');
  btn.disabled=true;btn.textContent='Compressing & Uploading...';
  try {
    const files=document.getElementById('evidenceFile').files;
    const evidence=[];
    for(let i=0;i<files.length;i++){
      const f=files[i];
      if (f.type.startsWith('image/')) {
        const compressedData = await compressImage(f, 1200, 0.75);
        evidence.push({name: f.name, data: compressedData});
      } else {
        const data=await new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f)});
        evidence.push({name:f.name,data:data});
      }
    }
    const jsonData={ teamId:myTeamId, categoryId:myCatId, taskNum:myTaskNum, note:document.getElementById('note').value, evidence:evidence };
    const res=await fetch('/api/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(jsonData)});
    const result=await res.json();
    if(result.success){
      msg.className='msg ok'; msg.textContent='✅ Asset batch indexed successfully for verification review loops'; msg.style.display='block';
      document.getElementById('evidenceFile').value=''; document.getElementById('fileName').style.display='none'; document.getElementById('filePreview').style.display='none'; document.getElementById('uploadArea').classList.remove('has-file'); document.getElementById('note').value='';
      await loadSubs(); renderAll(); renderTasks();
      setTimeout(() => { backToTasks(); }, 1200);
    } else { msg.className='msg err'; msg.textContent='❌ '+(result.error||'Failed'); msg.style.display='block'; }
  } catch(e){msg.className='msg err';msg.textContent='❌ Network pipeline disruption error';msg.style.display='block';}
  btn.textContent='Submit Task for Verification';btn.disabled=false;
}

function compressImage(file, maxDim = 1200, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader(); reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image(); img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
        if (width > height) { if (width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; } }
        else { if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; } }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

function formatTime(isoString) {
  if (!isoString) return 'Pending sequence verification...';
  const d = new Date(isoString);
  return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' (' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ')';
}

function renderHistory(){
  if(!allSubs.length){document.getElementById('historyList').innerHTML='<div class="empty">No indexed actions discovered inside system metrics tables.</div>';return;}
  document.getElementById('historyList').innerHTML=allSubs.map(s=>{
    const cat=CATEGORIES.find(c=>c.id===s.category_id);const task=cat?cat.tasks.find(t=>t.num===s.task_num):null;
    const name=task?task.name:s.category_id+'-'+s.task_num;const pts=task?task.pts:0;
    const icon=s.status==='pending'?'⏳':s.status==='approved'?'✅':'❌';
    const cls=s.status==='pending'?'sub-pending':s.status==='approved'?'sub-approved':'sub-rejected';
    const ptsHtml=s.status==='approved'?'<span class="sub-pts">+'+pts+' pts</span>':s.status==='rejected'?'<span style="color:var(--red);font-weight:700">Rejected</span>':'';
    let ev='';
    try{const ef=JSON.parse(s.evidence_file||'[]');if(Array.isArray(ef)&&ef.length>0)ev=ef.map((f,i)=>'<a href="/uploads/'+f+'" target="_blank" style="color:var(--blue);font-size:.78rem;font-weight:600;text-decoration:none;margin-left:4px">📷 Asset '+(i+1)+'</a>').join(' ')}catch(e){if(s.evidence_file&&s.evidence_file.length>10)ev='<a href="/uploads/'+s.evidence_file+'" target="_blank" style="color:var(--blue);font-size:.75rem">📎</a>';}
    
    let rejectCommentHtml = '';
    if(s.status === 'rejected' && s.rejection_comment) {
      rejectCommentHtml = `<div style="margin-top:6px; padding:8px 12px; background:var(--red-light); border-left: 3px solid var(--red); border-radius:6px; font-size:0.78rem; color:#b91c1c; font-weight:500;">` +
                            `<strong>💬 Feedback Reason:</strong> "${s.rejection_comment}"` +
                          `</div>`;
    }

    let reviewedTimeLabel = s.status === 'approved' ? 'Passed' : 'Flagged';
    let processedTimestampHtml = s.status !== 'pending' 
      ? `<span><strong>⏱️ Verified At:</strong> ${formatTime(s.reviewed_at)}</span>` 
      : `<span><strong>⏳ Status:</strong> Waiting for review verification loops...</span>`;

    let timestampsHtml = `<div class="sub-timestamps">` +
                           `<span><strong>📥 Punched At:</strong> ${formatTime(s.submitted_at)}</span>` +
                           processedTimestampHtml +
                         `</div>`;

    return '<div class="sub-item"><div class="sub-top"><span class="sub-icon">'+icon+'</span><span class="sub-task">'+name+'</span><span class="sub-badge '+cls+'">'+s.status+'</span></div>'+
      '<div class="sub-detail">'+ptsHtml+ev+'</div>' + rejectCommentHtml + timestampsHtml + '</div>';
  }).join('');
}

function renderLB(){
  const calcPts=t=>{const d=getDoneMap(t);let p=0;CATEGORIES.forEach(c=>c.tasks.forEach(tk=>{if(d[c.id+'-'+tk.num])p+=tk.pts;}));return p;};
  const sorted=[...teams].sort((a,b)=>calcPts(b)-calcPts(a));
  document.getElementById('miniLB').innerHTML=sorted.map((t,i)=>{
    const pts=calcPts(t);const isMe=t.id===myTeamId;
    const rc=i===0?'r1':i===1?'r2':i===2?'r3':'';
    return '<div class="mlb-entry'+(isMe?' me':'')+'"><div class="mlb-rank '+rc+'">'+(i+1)+'</div>'+
      '<div class="mlb-dot" style="background:'+t.color+'"></div><div class="mlb-name">'+t.name+(isMe?' (You)':'')+'</div>'+
      '<div class="mlb-pts">'+pts+' pts</div></div>';
  }).join('');
}

async function manualRefresh() { if(myTeamId){await loadSubs();renderAll();if(activeSection==='submit'&&myCatId)renderTasks();} toast('🔄','Dashboard synchronized'); }

init();
setInterval(async()=>{if(myTeamId){await loadSubs();renderAll();if(activeSection==='submit'&&myCatId)renderTasks();}},3000);
</script>
